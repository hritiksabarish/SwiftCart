<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart — My Cart</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; padding: 2rem 0 3rem; }
        @media(max-width:968px) { .cart-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="page-wrapper">
    <div class="container">
        <div style="padding:1.25rem 0 0;font-size:0.8rem;color:var(--text-muted)">
            <a href="/index.html" style="color:var(--text-muted)">Home</a> /
            <span style="color:var(--primary)">Shopping Cart</span>
        </div>
        <h1 style="margin:1rem 0 0;font-size:1.6rem;font-weight:700">
            <i class="fa-solid fa-cart-shopping" style="color:var(--primary);margin-right:0.5rem"></i>
            Shopping Cart
        </h1>
        <div class="cart-layout">
            <div id="cart-content"></div>
            <div id="cart-summary"></div>
        </div>
    </div>
</div>
<div id="footer-placeholder"></div>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script>buildNavbar(); loadCart();</script>
</body>
</html>
