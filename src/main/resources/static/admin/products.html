<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart — Admin: Products</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-user"><div class="sidebar-avatar" style="background:linear-gradient(135deg,#E65100,#FF6F00)">A</div><div class="sidebar-user-info"><h4>Admin Panel</h4><span>SwiftCart</span></div></div></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
            <a href="/admin/products.html" class="sidebar-link active" style="position:relative"><i class="fa-solid fa-boxes-stacked"></i> Products</a>
            <a href="/admin/categories.html" class="sidebar-link"><i class="fa-solid fa-tags"></i> Categories</a>
            <a href="/admin/orders.html" class="sidebar-link"><i class="fa-solid fa-cart-arrow-down"></i> Orders</a>
            <a href="/admin/users.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Customers</a>
        </nav>
        <div class="sidebar-footer">
            <a href="/index.html" class="sidebar-link"><i class="fa-solid fa-store"></i> View Store</a>
            <div class="sidebar-link danger" onclick="logout()" style="cursor:pointer"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
        </div>
    </aside>

    <main class="dashboard-main">
        <div class="flex-between" style="margin-bottom:1.5rem">
            <div class="page-header" style="margin-bottom:0"><h1>Products</h1><p>Manage your product catalog</p></div>
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
        </div>

        <!-- Search & Filter Bar -->
        <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap">
            <div style="position:relative;flex:1;min-width:200px">
                <i class="fa-solid fa-magnifying-glass" style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.875rem"></i>
                <input type="text" id="product-search" class="form-control" style="padding-left:2.5rem;height:40px" placeholder="Search products..."
                       oninput="debounce(loadProducts, 400)()">
            </div>
            <select class="form-control" id="cat-filter" style="height:40px;width:180px" onchange="loadProducts()">
                <option value="">All Categories</option>
            </select>
            <select class="form-control" id="status-filter" style="height:40px;width:150px" onchange="loadProducts()">
                <option value="">All Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </div>

        <!-- Products Table -->
        <div class="dashboard-table-card">
            <div id="products-table-container"></div>
        </div>
        <div id="pagination" class="pagination"></div>

        <!-- Add/Edit Modal -->
        <div id="product-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;padding:1rem">
            <div style="background:white;border-radius:var(--radius-md);padding:2rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
                    <h3 style="font-weight:700" id="modal-title">Add Product</h3>
                    <button onclick="closeModal()" style="background:none;border:none;font-size:1.25rem;cursor:pointer;color:var(--text-muted)"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <input type="hidden" id="product-id">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Product Name <span>*</span></label>
                        <input type="text" class="form-control" id="p-name" placeholder="Product name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category <span>*</span></label>
                        <select class="form-control" id="p-category"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" id="p-brand" placeholder="Brand name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price (₹) <span>*</span></label>
                        <input type="number" class="form-control" id="p-price" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Discount Price (₹)</label>
                        <input type="number" class="form-control" id="p-discount" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Stock Quantity <span>*</span></label>
                        <input type="number" class="form-control" id="p-stock" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unit</label>
                        <input type="text" class="form-control" id="p-unit" placeholder="e.g. 1 kg, 500 g, 1 L">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Image URL</label>
                        <input type="text" class="form-control" id="p-image" placeholder="https://...">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="p-description" placeholder="Product description" style="height:80px"></textarea>
                    </div>
                    <div class="custom-check" style="grid-column:1/-1">
                        <input type="checkbox" id="p-active" checked>
                        <label for="p-active">Active (visible in store)</label>
                    </div>
                    <div class="custom-check" style="grid-column:1/-1">
                        <input type="checkbox" id="p-featured">
                        <label for="p-featured">Featured Product</label>
                    </div>
                </div>
                <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
                    <button class="btn btn-primary" onclick="saveProduct()" id="save-product-btn">Save Product</button>
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/api.js"></script>
<script>
requireAdmin();

let currentPage = 0;
let totalPages = 0;
let categories = [];

async function init() {
    const res = await api.get('/categories');
    categories = res.data || [];
    const catFilter = document.getElementById('cat-filter');
    const pCat = document.getElementById('p-category');
    categories.forEach(c => {
        catFilter.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name}</option>`);
        pCat.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name}</option>`);
    });
    loadProducts();

    // Check URL for ?action=add
    if (new URLSearchParams(window.location.search).get('action') === 'add') openAddModal();
}

async function loadProducts() {
    const q = document.getElementById('product-search').value.trim();
    const cat = document.getElementById('cat-filter').value;
    const status = document.getElementById('status-filter').value;
    document.getElementById('products-table-container').innerHTML = `<div class="page-loading" style="min-height:200px"><div class="spinner spinner-green"></div></div>`;

    try {
        let endpoint;
        if (q) endpoint = `/products/search?q=${encodeURIComponent(q)}&page=${currentPage}&size=15`;
        else if (cat) endpoint = `/products/category/${cat}?page=${currentPage}&size=15`;
        else endpoint = `/products?page=${currentPage}&size=15&sortBy=createdAt&sortDir=desc`;

        const res = await api.get(endpoint);
        const data = res.data;
        totalPages = data.totalPages;
        let products = data.content || [];
        if (status !== '') products = products.filter(p => String(p.isActive) === status);

        if (!products.length) {
            document.getElementById('products-table-container').innerHTML = `<div class="empty-state"><h3>No products found</h3></div>`;
            return;
        }

        document.getElementById('products-table-container').innerHTML = `
        <div class="table-wrapper" style="border:none;border-radius:0">
        <table>
            <thead><tr>
                <th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${products.map(p => `<tr>
                <td>
                    <div style="display:flex;align-items:center;gap:0.75rem">
                        <div style="width:44px;height:44px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);flex-shrink:0">
                            <img src="${p.imageUrl||'https://via.placeholder.com/44'}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.src='https://via.placeholder.com/44'">
                        </div>
                        <div>
                            <div style="font-weight:600;font-size:0.875rem">${p.name}</div>
                            <div style="font-size:0.75rem;color:var(--text-muted)">${p.brand||''} • ${p.unit||''}</div>
                        </div>
                    </div>
                </td>
                <td><span class="badge badge-primary" style="font-size:0.7rem">${p.categoryName||''}</span></td>
                <td>
                    <div style="font-weight:700">₹${parseFloat(p.discountPrice||p.price).toFixed(2)}</div>
                    ${p.discountPrice ? `<div style="font-size:0.75rem;color:var(--text-muted);text-decoration:line-through">₹${parseFloat(p.price).toFixed(2)}</div>` : ''}
                </td>
                <td><span class="badge ${p.stockQuantity <= 5 ? 'badge-error' : p.stockQuantity <= 15 ? 'badge-warning' : 'badge-success'}">${p.stockQuantity}</span></td>
                <td><span class="badge ${p.isActive ? 'badge-success' : 'badge-muted'}">${p.isActive ? 'Active' : 'Inactive'}</span></td>
                <td>
                    <div style="display:flex;gap:0.375rem">
                        <button class="btn btn-ghost btn-sm" onclick='openEditModal(${JSON.stringify(p).replaceAll("'", "&#39;")})' title="Edit">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-sm" style="background:#ffebee;color:var(--error);border:1px solid #ffcdd2" onclick="deleteProduct(${p.id})" title="Delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>`).join('')}</tbody>
        </table></div>`;
        renderPagination();
    } catch(e) { document.getElementById('products-table-container').innerHTML = `<p class="text-muted" style="padding:1rem">Error: ${e.message}</p>`; }
}

function renderPagination() {
    const c = document.getElementById('pagination');
    if (totalPages <= 1) { c.innerHTML = ''; return; }
    let h = `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===0?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 0; i < totalPages; i++) h += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i+1}</button>`;
    h += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages-1?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button>`;
    c.innerHTML = h;
}

function goToPage(page) { if (page < 0 || page >= totalPages) return; currentPage = page; loadProducts(); }

function openAddModal() {
    document.getElementById('product-id').value = '';
    document.getElementById('modal-title').textContent = 'Add Product';
    ['p-name','p-brand','p-price','p-discount','p-stock','p-unit','p-image','p-description'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('p-active').checked = true;
    document.getElementById('p-featured').checked = false;
    document.getElementById('product-modal').style.display = 'flex';
}

function openEditModal(p) {
    document.getElementById('product-id').value = p.id;
    document.getElementById('modal-title').textContent = 'Edit Product';
    document.getElementById('p-name').value = p.name || '';
    document.getElementById('p-brand').value = p.brand || '';
    document.getElementById('p-price').value = p.price || '';
    document.getElementById('p-discount').value = p.discountPrice || '';
    document.getElementById('p-stock').value = p.stockQuantity || '';
    document.getElementById('p-unit').value = p.unit || '';
    document.getElementById('p-image').value = p.imageUrl || '';
    document.getElementById('p-description').value = p.description || '';
    document.getElementById('p-active').checked = p.isActive;
    document.getElementById('p-featured').checked = p.isFeatured || false;
    document.getElementById('p-category').value = p.categoryId || '';
    document.getElementById('product-modal').style.display = 'flex';
}

function closeModal() { document.getElementById('product-modal').style.display = 'none'; }

async function saveProduct() {
    const id = document.getElementById('product-id').value;
    const body = {
        name: document.getElementById('p-name').value.trim(),
        categoryId: parseInt(document.getElementById('p-category').value),
        brand: document.getElementById('p-brand').value.trim(),
        price: parseFloat(document.getElementById('p-price').value),
        discountPrice: document.getElementById('p-discount').value ? parseFloat(document.getElementById('p-discount').value) : null,
        stockQuantity: parseInt(document.getElementById('p-stock').value),
        unit: document.getElementById('p-unit').value.trim(),
        imageUrl: document.getElementById('p-image').value.trim(),
        description: document.getElementById('p-description').value.trim(),
        isActive: document.getElementById('p-active').checked,
        isFeatured: document.getElementById('p-featured').checked
    };
    if (!body.name || !body.categoryId || isNaN(body.price)) { showToast('Please fill name, category, and price', 'warning'); return; }

    const btn = document.getElementById('save-product-btn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner spinner-sm"></span> Saving...';
    try {
        if (id) await api.put(`/products/${id}`, body);
        else await api.post('/products', body);
        showToast('Product saved!', 'success');
        closeModal();
        loadProducts();
    } catch(e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = 'Save Product'; }
}

async function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    try { await api.delete(`/products/${id}`); showToast('Product deleted', 'info'); loadProducts(); }
    catch(e) { showToast(e.message, 'error'); }
}

// Close modal on backdrop click
document.getElementById('product-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
