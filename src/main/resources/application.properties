# ===========================
# Application Configuration
# ===========================
spring.application.name=swiftcart
server.port=8080

# ===========================
# DataSource (MySQL)
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/grocery_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# ===========================
jwt.secret=GroceryStoreSecretKeyForJWTTokenGenerationMustBe256BitsLongAtLeast
jwt.expiration=86400000

# ===========================
# File Upload
# ===========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===========================
# Logging
# ===========================
logging.level.com.grocerystore=DEBUG
logging.level.org.springframework.security=INFO
